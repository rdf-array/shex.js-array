- schemaLabel: 'SPARQL: colours as sequences'
  schema: |
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX : <http://a.example/>

    :Colour {
      :name xsd:string ;
      :rgb ((xsd:integer MININCLUSIVE 0 MAXINCLUSIVE 255))[3] ;
      :paint . ?
    }
  data: |
    PREFIX : <http://a.example/>

    :red   :name "red" ;
           :rgb (255 0 0) ;
           :paint [ :brand "Acme" ; :tints ([ :name "light" ] [ :name "dark" ]) ] .
    :green :name "green" ;
           :rgb (0 255 0) .
  queryMap: |
    <http://a.example/red>@<http://a.example/Colour>,
    <http://a.example/green>@<http://a.example/Colour>
  status: conformant
  dataLabel: 'every triple'
  query: |
    SELECT ?s ?p ?o
    WHERE { ?s ?p ?o }
  plugins:
  - ../doc/ShExSparqlPlugin.js
  comment: 'A SELECT is a table. The `(255 0 0)` is one cell: a sequence is one term, so it is one ?o.'
- schemaLabel: 'SPARQL: colours as sequences'
  schema: |
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX : <http://a.example/>

    :Colour {
      :name xsd:string ;
      :rgb ((xsd:integer MININCLUSIVE 0 MAXINCLUSIVE 255))[3] ;
      :paint . ?
    }
  data: |
    PREFIX : <http://a.example/>

    :red   :name "red" ;
           :rgb (255 0 0) ;
           :paint [ :brand "Acme" ; :tints ([ :name "light" ] [ :name "dark" ]) ] .
    :green :name "green" ;
           :rgb (0 255 0) .
  queryMap: |
    <http://a.example/red>@<http://a.example/Colour>,
    <http://a.example/green>@<http://a.example/Colour>
  status: conformant
  dataLabel: 'the colours, as a table'
  query: |
    PREFIX : <http://a.example/>
    SELECT ?name ?rgb ?brand
    WHERE {
      ?c :name ?name ; :rgb ?rgb .
      OPTIONAL { ?c :paint/:brand ?brand }
    }
    ORDER BY ?name
  plugins:
  - ../doc/ShExSparqlPlugin.js
  comment: '?brand is unbound for :green, and an unbound cell is shaded rather than empty text.'
