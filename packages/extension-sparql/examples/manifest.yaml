           :rgb (0 255 0) .
  queryMap: |
    <http://a.example/red>@<http://a.example/Colour>,
    <http://a.example/green>@<http://a.example/Colour>
  status: conformant
  dataLabel: 'a CONSTRUCT, as Turtle'
  query: |
    PREFIX : <http://a.example/>
    CONSTRUCT { ?c :rgb ?rgb ; :paint ?p . ?p :brand ?b }
    WHERE { ?c :rgb ?rgb ; :paint ?p . ?p :brand ?b }
  plugins:
  - ../doc/ShExSparqlPlugin.js
  comment: 'A graph is written as Turtle by n3writer-wrapper: the single-use blank node nests as [ ], and the rgb sequence stays `( … )`.'
