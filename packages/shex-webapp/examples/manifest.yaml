  comment: 'The SPARQL tab: the same data, asked for every triple. A sequence is one term, so it is one ?o ((255 0 0), not a ladder of rdf:first and rdf:rest triples), which is what the shapes above match.'
- schemaLabel: 'rdf-array: a playlist of tracks'
  schema: |
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX : <http://a.example/>

    <Playlist> {
      :title  xsd:string ;
      :tracks ((@<Track>))[1, *]   # one or more tracks, in order
    }

    <Track> {
      :title   xsd:string ;
      :seconds xsd:integer
    }
  dataLabel: two tracks
  data: |
    PREFIX : <http://a.example/>

    <mix> :title "Monday" ;
          :tracks (<t1> <t2>) .

    <t1> :title "Intro" ; :seconds 95 .
    <t2> :title "Outro" ; :seconds 210 .
  queryMap: |
    <mix>@<Playlist>
  status: conformant
  comment: 'Each element is a focus node of its own: `@<Track>` is checked against the element''s triples, and the order of the tracks is the order of the sequence, with no ladder to walk.'
- schemaLabel: 'rdf-array: a playlist of tracks'
  schema: |
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX : <http://a.example/>

    <Playlist> {
      :title  xsd:string ;
      :tracks ((@<Track>))[1, *]   # one or more tracks, in order
    }

    <Track> {
      :title   xsd:string ;
      :seconds xsd:integer
    }
  dataLabel: the second track has no duration
  data: |
    PREFIX : <http://a.example/>

    <mix> :title "Monday" ;
          :tracks (<t1> <t2>) .

    <t1> :title "Intro" ; :seconds 95 .
    <t2> :title "Outro" .
  queryMap: |
    <mix>@<Playlist>
  status: nonconformant
  comment: The Collection reports a CollectionElementFailure for element 1 (counting from 0), carrying <Track>'s own errors for <t2>.
