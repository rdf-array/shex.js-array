- schemaLabel: 'rdf-array: a colour is three bytes'
  schema: |
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX : <http://a.example/>

    <Colour> {
      :rgb ((xsd:integer MININCLUSIVE 0 MAXINCLUSIVE 255))[3]   # a sequence of exactly 3 bytes
    }
  dataLabel: red
  data: |
    PREFIX : <http://a.example/>

    <red> :rgb (255 0 0) .
  queryMap: |
    <red>@<Colour>
  status: conformant
  comment: 'rdf-array: `(255 0 0)` is one term, a sequence of three integers, not an rdf:first/rdf:rest ladder of blank nodes. ShEx-array''s Collection `((shapeExpr))[3]` matches a sequence of exactly three elements, each satisfying shapeExpr.'
- schemaLabel: 'rdf-array: a colour is three bytes'
  schema: |
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX : <http://a.example/>

    <Colour> {
      :rgb ((xsd:integer MININCLUSIVE 0 MAXINCLUSIVE 255))[3]   # a sequence of exactly 3 bytes
    }
  dataLabel: pink has only two components
  data: |
    PREFIX : <http://a.example/>

    <pink> :rgb (255 192) .
  queryMap: |
    <pink>@<Colour>
  status: nonconformant
  comment: 'Two elements where `[3]` wants exactly three: a CollectionLengthViolation. `[m, n]` bounds the length, `[m, *]` (or `[m,]`) is at least m, and no bounds is any length.'
- schemaLabel: 'rdf-array: a colour is three bytes'
  schema: |
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX : <http://a.example/>

    <Colour> {
      :rgb ((xsd:integer MININCLUSIVE 0 MAXINCLUSIVE 255))[3]   # a sequence of exactly 3 bytes
    }
  dataLabel: 'red: every triple (SPARQL)'
  data: |
    PREFIX : <http://a.example/>

    <red> :rgb (255 0 0) .
  queryMap: |
    <red>@<Colour>
  status: conformant
  query: |
    SELECT ?s ?p ?o
    WHERE { ?s ?p ?o }
  plugins:
  - ../../extension-sparql/doc/ShExSparqlPlugin.js
  comment: 'The SPARQL tab: the same data, asked for every triple. A sequence is one term, so it is one ?o ((255 0 0), not a ladder of rdf:first and rdf:rest triples), which is what the shapes above match.'
- schemaLabel: 'rdf-array: a polygon is three or more points'
  schema: |
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX : <http://a.example/>

    <Polygon> {
      :points ((((xsd:decimal))[2]))[3, *]   # 3 or more points, each a sequence of 2 decimals
    }
  dataLabel: a triangle
  data: |
    PREFIX : <http://a.example/>

    <triangle> :points ((0.0 0.0) (4.0 0.0) (0.0 3.0)) .
  queryMap: |
    <triangle>@<Polygon>
  status: conformant
  comment: 'Sequences nest: each element of the outer sequence is a sequence matched by the inner Collection. `((x))` is always a Collection and `(x)` a parenthesised shape expression, so `((((xsd:decimal))[2]))` is a Collection of Collections.'
- schemaLabel: 'rdf-array: a polygon is three or more points'
